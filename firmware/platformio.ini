[platformio]
default_envs = dev

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Porta detectada automaticamente. Para fixar, descomente e ajuste:
; monitor_port = /dev/cu.usbserial-XXXX
; upload_port = /dev/cu.usbserial-XXXX
lib_deps =
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.15
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17

[env:dev]
build_type = debug
build_flags = -DCORE_DEBUG_LEVEL=4

[env:release]
build_type = release
build_flags = -DCORE_DEBUG_LEVEL=1

; Gravação pelo Wi-Fi (OTA), com a senha da estação em variável de ambiente (nunca no git):
;   GRAIN_OTA_PASS='...' pio run -e ota -t upload
[env:ota]
extends = env:release
upload_protocol = espota
upload_port = grain.local
upload_flags =
    --port=3232
    --auth=${sysenv.GRAIN_OTA_PASS}
